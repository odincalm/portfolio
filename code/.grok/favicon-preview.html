<!doctype html><meta charset=utf-8>
<style>
  html,body{margin:0;background:#d8d8d8}
  .row{display:flex;gap:28px;align-items:flex-end;padding:28px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;font:12px sans-serif;color:#222}
  img{display:block;background:#090b10}
  .s16{width:16px;height:16px}
  .s32{width:32px;height:32px}
  .s48{width:48px;height:48px}
  .light{background:#f4f2ec}
</style>
<body>
<div class=row>
  <div class=cell>16<img class="s16" src="favicon.svg.tmp"></div>
  <div class=cell>32<img class="s32" src="favicon.svg.tmp"></div>
  <div class=cell>48<img class="s48" src="favicon.svg.tmp"></div>
  <div class=cell>16 light<img class="s16 light" src="favicon.svg.tmp"></div>
</div>
</body>
